---
# =============================================================
# Playbook 04 — Timezone Management for Windows hosts (WinRM)
# Variables:
#   target_timezone : IANA timezone string (e.g. "Europe/Paris")
#                     Automatically mapped to Windows TZ ID
# =============================================================
- name: "Manage timezone on Windows hosts via WinRM"
  hosts: windows_hosts
  gather_facts: false

  vars:
    # IANA timezone (passed from CI/CD or group_vars)
    target_timezone: "{{ timezone_first }}"

    # Mapping IANA → Windows Timezone IDs
    iana_to_windows_tz:
      "Europe/Paris":      "Romance Standard Time"
      "Africa/Abidjan":    "Greenwich Standard Time"
      "UTC":               "UTC"
      "Europe/London":     "GMT Standard Time"
      "America/New_York":  "Eastern Standard Time"
      "America/Chicago":   "Central Standard Time"
      "America/Los_Angeles": "Pacific Standard Time"
      "Asia/Tokyo":        "Tokyo Standard Time"
      "Asia/Shanghai":     "China Standard Time"
      "Australia/Sydney":  "AUS Eastern Standard Time"

    # Resolve Windows TZ ID from IANA string
    windows_tz_id: "{{ iana_to_windows_tz[target_timezone] | default('Romance Standard Time') }}"

  pre_tasks:
    - name: Get timezone BEFORE change
      ansible.windows.win_shell: |
        $tz = Get-TimeZone
        Write-Output "$($tz.Id)|$($tz.DisplayName)"
      register: tz_before
      changed_when: false

    - name: "Show Windows timezone BEFORE"
      debug:
        msg: >
          [{{ inventory_hostname }}] Timezone BEFORE: {{ tz_before.stdout | trim }}
          | IANA target: {{ target_timezone }}
          | Windows ID: {{ windows_tz_id }}

  tasks:
    - name: Set Windows timezone via PowerShell
      ansible.windows.win_shell: |
        Set-TimeZone -Id "{{ windows_tz_id }}"
        $result = Get-TimeZone
        Write-Output "Set to: $($result.Id) — $($result.DisplayName)"
      register: set_tz_result
      changed_when: true

    - name: Display result of timezone change
      debug:
        msg: "[{{ inventory_hostname }}] {{ set_tz_result.stdout | trim }}"

    - name: Sync Windows time with NTP
      ansible.windows.win_shell: |
        w32tm /resync /force
        Write-Output "NTP sync triggered"
      register: ntp_sync
      changed_when: false
      ignore_errors: true

    - name: Display NTP sync result
      debug:
        msg: "[{{ inventory_hostname }}] {{ ntp_sync.stdout | trim }}"

  post_tasks:
    - name: Get timezone AFTER change
      ansible.windows.win_shell: |
        $tz = Get-TimeZone
        Write-Output "$($tz.Id)"
      register: tz_after
      changed_when: false

    - name: "Show Windows timezone AFTER"
      debug:
        msg: "[{{ inventory_hostname }}] Timezone AFTER: {{ tz_after.stdout | trim }}"

    - name: Verify Windows timezone was correctly applied
      assert:
        that:
          - tz_after.stdout | trim == windows_tz_id
        fail_msg: >
          FAILED: Expected '{{ windows_tz_id }}' but got
          '{{ tz_after.stdout | trim }}' on {{ inventory_hostname }}
        success_msg: >
          OK: Windows timezone correctly set to '{{ windows_tz_id }}'
          ({{ target_timezone }}) on {{ inventory_hostname }}

    - name: Show current Windows date and time
      ansible.windows.win_shell: |
        Get-Date -Format "dddd, dd MMMM yyyy HH:mm:ss zzz"
      register: win_date
      changed_when: false

    - name: Display Windows date/time confirmation
      debug:
        msg: "[{{ inventory_hostname }}] Current date/time: {{ win_date.stdout | trim }}"
